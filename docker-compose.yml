version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nazma-erp-app

    restart: unless-stopped

    ports:
      - "3001:3000"
      - "5555:5555"

    env_file:
      - .env

    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine

    container_name: nazma-erp-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: nazma_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: