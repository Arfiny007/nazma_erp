services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    container_name: nazma-erp-app

    restart: unless-stopped

    ports:
      - "3001:3000"
      - "5555:5555"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed

    container_name: nazma-erp-seed

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    profiles:
      - tools

  postgres:
    image: postgres:16-alpine

    container_name: nazma-erp-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: nazma_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nazma_erp"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
